<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#f4f4f4; color:#111; }
  #app-root { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { color:#b91c1c; }
  .panel { background: white; border:1px solid #e2e2e2; border-radius:12px; padding:18px; margin-bottom:18px; }
  .news-item { display:grid; grid-template-columns: 230px 1fr auto; gap:14px; align-items:start; padding:12px 0; border-bottom:1px solid #eee; }
  .news-item textarea { width:100%; min-height:120px; padding:8px; border:1px solid #ccc; border-radius:6px; font-family:inherit; font-size:13px; }
  .photo-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .photo-thumb { position:relative; width:66px; height:66px; border-radius:8px; overflow:hidden; border:1px solid #ddd; }
  .photo-thumb img { width:100%; height:100%; object-fit:cover; }
  .photo-del { position:absolute; top:2px; right:2px; width:20px; height:20px; border:none; border-radius:50%; background:rgba(0,0,0,0.65); color:#fff; font-size:14px; line-height:1; cursor:pointer; padding:0; }
  .photo-slot { width:66px; height:66px; border:2px dashed #ccc; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; font-size:11px; color:#999; text-align:center; }
  .photo-slot img { width:100%; height:100%; object-fit:cover; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:#555; }
  .field input, .field select { padding:8px; border:1px solid #ccc; border-radius:6px; font-size:13px; }
  .btn { background:#b91c1c; color:white; border:none; padding:10px 18px; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; }
  .btn.secondary { background:#333; }
  .btn.small { padding:6px 12px; font-size:12px; }
  select, input[type=range] { padding:6px; border-radius:6px; border:1px solid #ccc; }

  .stage-wrap { display:flex; justify-content:center; background:#000; border-radius:12px; padding:10px; }
  .stage { position:relative; width:640px; height:360px; background:#000; overflow:hidden; border-radius:8px; }
  .stage img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transition: transform 8s linear; }
  .stage .overlay-text { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,0.85) 40%); color:white; padding:30px 20px 26px; font-size:16px; font-weight:700; line-height:1.5; text-align:center; }
  .stage .brand-bar { position:absolute; top:0; left:0; right:0; background:#b91c1c; color:white; padding:10px 16px; font-weight:800; font-style:italic; font-size:15px; display:flex; justify-content:space-between; }
  .controls { display:flex; gap:10px; align-items:center; margin-top:14px; justify-content:center; flex-wrap:wrap; }
  canvas#thumbCanvas { display:none; }
  .thumb-preview { max-width:100%; border-radius:8px; border:2px solid #b91c1c; margin-top:10px; }
</style>

const OUTRO_MIN_DURATION = 6.0;
const GOLD = '#f5c518';
const EDGE_TTS_URL = 'http://127.0.0.1:8130';
const VOICEBOX_URL = 'http://127.0.0.1:17493';

function easeOutCubic(x){ return 1 - Math.pow(1-x,3); }
function clamp01(x){ return Math.max(0, Math.min(1,x)); }

function drawIntroFrame(ctx, W, H, t, logoImg) {
  const base = Math.min(W,H);
  const RED = '#ec4a3a', RED_DEEP = '#b8281c', WHITE = '#f5f5f2', INK = '#141414', INK_DEEP = '#070707';
  const cx = W/2, cy = H*0.40;

  // background
  const bgGrad = ctx.createRadialGradient(cx, cy, base*0.05, cx, cy, base*0.95);
  bgGrad.addColorStop(0, INK);
  bgGrad.addColorStop(0.68, INK_DEEP);
  bgGrad.addColorStop(1, '#000');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  // streak wipe
  if (t < 0.75) {
    const p = clamp01(t/0.62);
    ctx.save();
    ctx.globalAlpha = p < 0.08 ? p/0.08 : (p > 0.85 ? Math.max(0,(1-p)/0.15) : 1);
    [0.22,0.38,0.56,0.72].forEach((ry,i)=>{
      const dir = i%2===0 ? 1 : -1;
      const sx = dir>0 ? -W*0.5 + p*W*2.2 : W*1.5 - p*W*2.2;
      const y = H*ry;
      const grad = ctx.createLinearGradient(sx-W*0.23,y,sx+W*0.23,y);
      grad.addColorStop(0,'rgba(236,74,58,0)');
      grad.addColorStop(0.5,'rgba(245,245,242,0.9)');
      grad.addColorStop(1,'rgba(236,74,58,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx-W*0.23,y); ctx.lineTo(sx+W*0.23,y); ctx.stroke();
    });
    ctx.restore();
  }
  if (t>0.5 && t<0.95){
    const p = (t-0.5)/0.45;
    const alpha = p<0.4 ? (p/0.4)*0.5 : 0.5*(1-(p-0.4)/0.6);
    ctx.fillStyle = `rgba(245,245,242,${Math.max(0,alpha)})`;
    ctx.fillRect(0,0,W,H);
  }

  // rings
  if (t>0.55){
    const ringP = easeOutCubic(clamp01((t-0.55)/0.9));
    const spin1 = (t*(360/7))*Math.PI/180;
    const spin2 = (-t*(360/9.5))*Math.PI/180;
    ctx.save(); ctx.globalAlpha = ringP*0.55; ctx.strokeStyle = RED; ctx.lineWidth = base*0.0035;
    ctx.setLineDash([base*0.005, base*0.024]);
    ctx.beginPath(); ctx.arc(cx,cy, base*0.235*ringP, spin1, spin1+Math.PI*2); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.globalAlpha = ringP*0.32; ctx.strokeStyle = WHITE; ctx.lineWidth = base*0.0025;
    ctx.setLineDash([base*0.09,base*0.012,base*0.006,base*0.012]);
    ctx.beginPath(); ctx.arc(cx,cy, base*0.196*ringP, spin2, spin2+Math.PI*2); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.globalAlpha = ringP*0.5; ctx.setLineDash([]); ctx.strokeStyle = RED; ctx.lineWidth = base*0.0045;
    ctx.beginPath(); ctx.arc(cx,cy, base*0.155*ringP, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }

  // glow
  if (t>0.9){
    const gp = easeOutCubic(clamp01((t-0.9)/1));
    const glowGrad = ctx.createRadialGradient(cx,cy,0,cx,cy, base*0.2);
    glowGrad.addColorStop(0, `rgba(236,74,58,${0.45*gp})`);
    glowGrad.addColorStop(1, 'rgba(236,74,58,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(cx-base*0.2, cy-base*0.2, base*0.4, base*0.4);
  }

  // logo
  if (t>1.05 && logoImg){
    const lp = clamp01((t-1.05)/0.7);
    const scale = 0.3 + 0.7*easeOutCubic(lp);
    const rot = (1-easeOutCubic(lp)) * -25 * Math.PI/180;
    const size = base*0.2;
    ctx.save();
    ctx.globalAlpha = clamp01(lp/0.5);
    ctx.translate(cx,cy); ctx.rotate(rot); ctx.scale(scale,scale);
    ctx.drawImage(logoImg, -size/2, -size/2, size, size);
    ctx.restore();
  }

  // wordmark
  const wordY = cy + base*0.31;
  if (t>1.55){
    const wp = easeOutCubic(clamp01((t-1.55)/0.7));
    ctx.save(); ctx.globalAlpha = wp;
    const fsz = Math.round(base*0.05);
    ctx.font = `700 ${fsz}px Rajdhani, Arial`;
    const part1='KUWAIT ', part2='NEWS', part3=' HINDI';
    const w1 = ctx.measureText(part1).width, w2 = ctx.measureText(part2).width, w3 = ctx.measureText(part3).width;
    let x = cx - (w1+w2+w3)/2;
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillStyle = WHITE; ctx.fillText(part1, x, wordY); x+=w1;
    ctx.fillStyle = RED; ctx.fillText(part2, x, wordY); x+=w2;
    ctx.fillStyle = WHITE; ctx.fillText(part3, x, wordY);
    ctx.restore();
  }
  if (t>1.85){
    const hp = clamp01((t-1.85)/0.6);
    ctx.save(); ctx.globalAlpha = 0.85*hp;
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.font = `700 ${Math.round(base*0.022)}px "Noto Sans Devanagari", Arial`;
    ctx.fillStyle = WHITE;
    ctx.fillText('कुवैत न्यूज़ हिंदी', cx, wordY + base*0.045);
    ctx.restore();
  }
  if (t>2.0){
    const up = easeOutCubic(clamp01((t-2.0)/0.6));
    const lw = base*0.34*up;
    const uy = wordY + base*0.075;
    const grad = ctx.createLinearGradient(cx-lw/2,0,cx+lw/2,0);
    grad.addColorStop(0,'rgba(236,74,58,0)'); grad.addColorStop(0.5,RED); grad.addColorStop(1,'rgba(236,74,58,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx-lw/2,uy); ctx.lineTo(cx+lw/2,uy); ctx.stroke();
  }

  // corner ticks
  if (t>1.4){
    const cp = clamp01((t-1.4)/0.5)*0.8;
    ctx.save(); ctx.globalAlpha = cp; ctx.strokeStyle = RED; ctx.lineWidth = base*0.003;
    const m = base*0.032, off = base*0.032;
    ctx.beginPath(); ctx.moveTo(off,off+m); ctx.lineTo(off,off); ctx.lineTo(off+m,off); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-off-m,off); ctx.lineTo(W-off,off); ctx.lineTo(W-off,off+m); ctx.stroke();
    ctx.restore();
  }

  // bottom breaking bar
  const barH = H*0.098;
  if (t>2.15){
    const bp = easeOutCubic(clamp01((t-2.15)/0.55));
    const barY = H - barH*bp;
    const tagW = Math.max(base*0.24, W*0.16);
    const tagGrad = ctx.createLinearGradient(0,barY,tagW,barY+barH);
    tagGrad.addColorStop(0,RED); tagGrad.addColorStop(1,RED_DEEP);
    ctx.fillStyle = tagGrad; ctx.fillRect(0,barY,tagW,barH);
    ctx.fillStyle = WHITE; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = `700 ${Math.round(base*0.026)}px "Noto Sans Devanagari", Arial`;
    ctx.fillText('ब्रेकिंग न्यूज़', tagW/2, barY+barH/2);

    ctx.fillStyle='rgba(7,7,7,0.85)'; ctx.fillRect(tagW,barY,W-tagW,barH);
    ctx.fillStyle=RED; ctx.fillRect(tagW,barY,base*0.006,barH);

    ctx.save();
    ctx.beginPath(); ctx.rect(tagW,barY,W-tagW,barH); ctx.clip();
    const tickerStr = '●  कुवैत की ताज़ा खबरें अब हिंदी में        ●  भारतीय प्रवासी समुदाय के लिए विश्वसनीय समाचार        ●  Kuwait News Hindi — हर खबर, हर पल, आपके साथ        ';
    ctx.font = `500 ${Math.round(base*0.024)}px "Noto Sans Devanagari", Arial`;
    ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle = WHITE;
    const fullW = ctx.measureText(tickerStr).width;
    const speed = base*0.085;
    const elapsed = t-2.15;
    let sx = tagW + W - ((elapsed*speed) % (fullW+W));
    ctx.fillText(tickerStr, sx, barY+barH/2);
    ctx.fillText(tickerStr, sx+fullW, barY+barH/2);
    ctx.restore();
  }
}

function App() {
  const [news, setNews] = useState(DEFAULT_NEWS);
  const [current, setCurrent] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [voices, setVoices] = useState([]);
  const [voiceIdx, setVoiceIdx] = useState(-1);
  const [rate, setRate] = useState(0.95);
  const [channelName, setChannelName] = useState("कुवैत न्यूज़ हिंदी");
  const [handle, setHandle] = useState("@kuwaitnewshindi1");
  const [vrKey, setVrKey] = useState(() => { try { return localStorage.getItem('nvm_voicerss_key') || ''; } catch(e) { return ''; } });
  const [edgeOk, setEdgeOk] = useState(false);
  const [voiceboxOk, setVoiceboxOk] = useState(false);
  const [voiceboxProfileId, setVoiceboxProfileId] = useState(null);
  const [thumbTitle, setThumbTitle] = useState("आज की बड़ी खबरें");
  const [thumbUrl, setThumbUrl] = useState("");
  const [recording, setRecording] = useState(false);
  const [videoUrl, setVideoUrl] = useState("");
  const [recStatus, setRecStatus] = useState("");
  const stageImgRef = useRef(null);
  const thumbCanvasRef = useRef(null);
  const stageCanvasRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const animRef = useRef(null);
  const imgCacheRef = useRef({});
  const logoImgRef = useRef(null);
  const audioCtxRef = useRef(null);
  const audioDestRef = useRef(null);
  const ttsSrcRef = useRef(null);
  const ttsCacheRef = useRef({});
  const edgeOkRef = useRef(false);
  const voiceboxOkRef = useRef(false);
  const voiceboxProfileIdRef = useRef(null);

  useEffect(() => {
    const im = new Image();
    im.onload = () => { logoImgRef.current = im; };
    im.src = LOGO_DATA_URI;
    try {
      document.fonts.load('700 40px "Noto Sans Devanagari"');
      document.fonts.load('700 40px "Rajdhani"');
    } catch(e) {}
  }, []);

  useEffect(() => {
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      setVoices(v);
      const hindiIdx = v.findIndex(x => x.lang.startsWith('hi'));
      if (hindiIdx >= 0) setVoiceIdx(hindiIdx);
    }
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }, []);

  // detect optional local Hindi voice server (edge-tts / gTTS) so recorded audio is real
  useEffect(() => {
    let stop = false;
    async function ping() {
      try {
        const r = await fetch(EDGE_TTS_URL + '/health', { cache: 'no-store' });
        const ok = r.ok;
        if (!stop) { edgeOkRef.current = ok; setEdgeOk(ok); }
      } catch (e) {
        if (!stop) { edgeOkRef.current = false; setEdgeOk(false); }
      }
    }
    ping();
    const id = setInterval(ping, 5000);
    return () => { stop = true; clearInterval(id); };
  }, []);

  // detect local Voicebox app + resolve the "jujar" cloned voice profile id
  useEffect(() => {
    let stop = false;
    async function ping() {
      try {
        const r = await fetch(VOICEBOX_URL + '/health', { cache: 'no-store' });
        if (!r.ok) throw new Error('not ok');
        if (!voiceboxProfileIdRef.current) {
          const pr = await fetch(VOICEBOX_URL + '/profiles', { cache: 'no-store' });
          const data = await pr.json();
          const items = Array.isArray(data) ? data : (data.profiles || []);
          const match = items.find(p => (p.name || '').toLowerCase() === VOICEBOX_PROFILE_NAME.toLowerCase());
          if (match) {
            voiceboxProfileIdRef.current = match.id;
            if (!stop) setVoiceboxProfileId(match.id);
          }
        }
        if (!stop) { voiceboxOkRef.current = !!voiceboxProfileIdRef.current; setVoiceboxOk(!!voiceboxProfileIdRef.current); }
      } catch (e) {
        if (!stop) { voiceboxOkRef.current = false; setVoiceboxOk(false); }
      }
    }
    ping();
    const id = setInterval(ping, 5000);
    return () => { stop = true; clearInterval(id); };
  }, []);

  useEffect(() => {
    if (!playing && stageCanvasRef.current) {
      drawStageFrame(current, 0);
    }
  }, [current, news, playing]);

  function updateText(idx, val) {
    const n = [...news]; n[idx] = { ...n[idx], text: val }; setNews(n);
  }
  function itemPhotos(item) {
    if (!item) return [];
    if (item.photos && item.photos.length) return item.photos;
    if (item.photo) return [item.photo];
    return [];
  }
  function updatePhotos(idx, files) {
    if (!files || !files.length) return;
    const arr = Array.from(files);
    Promise.all(arr.map(f => new Promise(res => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.readAsDataURL(f);
    }))).then(dataUris => {
      const n = [...news];
      const existing = itemPhotos(n[idx]);
      n[idx] = { ...n[idx], photos: [...existing, ...dataUris], photo: undefined };
      setNews(n);
    });
  }
  function removePhoto(idx, pi) {
    const n = [...news];
    const arr = itemPhotos(n[idx]).filter((_, i) => i !== pi);
    n[idx] = { ...n[idx], photos: arr, photo: undefined };
    setNews(n);
  }
  function addNews() { setNews([...news, { text: "", photos: [] }]); }
  function removeNews(idx) { setNews(news.filter((_,i) => i!==idx)); }

  function ensureAudio() {
    if (!audioCtxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtxRef.current = new AC();
      audioDestRef.current = audioCtxRef.current.createMediaStreamDestination();
    }
    if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
  }

  // fetch real TTS audio: Voicebox (jujar cloned voice) first, then local Hindi voice server, then VoiceRSS. null => none available.
  async function fetchTts(text) {
    if (voiceboxOkRef.current && voiceboxProfileIdRef.current) {
      try {
        const res = await fetch(VOICEBOX_URL + '/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            profile_id: voiceboxProfileIdRef.current,
            engine: VOICEBOX_ENGINE,
            language: 'hi'
          })
        });
        if (res.ok) return await res.arrayBuffer();
      } catch (e) {}
    }
    if (edgeOkRef.current) {
      try {
        const pct = Math.round((rate - 1) * 100);
        const rateStr = (pct >= 0 ? '+' : '') + pct + '%';
        const body = new URLSearchParams({ text, voice: 'hi-IN-MadhurNeural', rate: rateStr });
        const res = await fetch(EDGE_TTS_URL + '/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body
        });
        if (res.ok && (res.headers.get('content-type') || '').includes('audio')) return await res.arrayBuffer();
      } catch (e) {}
    }
    if (vrKey) {
      const r = Math.max(-10, Math.min(10, Math.round((rate - 1) * 10)));
      const body = new URLSearchParams({ key: vrKey, hl: 'hi-in', src: text, r: String(r), c: 'MP3', f: '44khz_16bit_stereo' });
      const res = await fetch('https://api.voicerss.org/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('audio')) return await res.arrayBuffer();
      throw new Error((await res.text()).slice(0, 120));
    }
    return null;
  }

  function playClip(arrbuf, onEnd) {
    const ctx = audioCtxRef.current;
    // slice(0) => decodeAudioData detaches the buffer; keep the cached copy intact
    ctx.decodeAudioData(arrbuf.slice(0)).then(buf => {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      if (audioDestRef.current) src.connect(audioDestRef.current);
      src.onended = () => { if (ttsSrcRef.current === src) ttsSrcRef.current = null; if (onEnd) onEnd(); };
      ttsSrcRef.current = src;
      src.start();
    }).catch(() => { if (onEnd) onEnd(); });
  }

  async function speak(text, onEnd) {
    window.speechSynthesis.cancel();
    ensureAudio();
    let buf = ttsCacheRef.current[text] || null;
    if (!buf) {
      try { buf = await fetchTts(text); if (buf) ttsCacheRef.current[text] = buf; }
      catch (e) { buf = null; setRecStatus("Voice error: " + e.message); }
    }
    if (buf) { playClip(buf, onEnd); return; }
    // fallback: browser voice — audible in preview, but NOT captured in the recording
    const utter = new SpeechSynthesisUtterance(text);
    if (voiceIdx >= 0 && voices[voiceIdx]) utter.voice = voices[voiceIdx];
    utter.lang = 'hi-IN';
    utter.rate = rate;
    utter.onend = onEnd;
    utter.onerror = onEnd;
    window.speechSynthesis.speak(utter);
  }

  function getImg(src) {
    if (!src) return Promise.resolve(null);
    if (imgCacheRef.current[src]) return Promise.resolve(imgCacheRef.current[src]);
    return new Promise(res => {
      const im = new Image();
      im.onload = () => { imgCacheRef.current[src] = im; res(im); };
      im.src = src;
    });
  }

  function drawCover(ctx, img, x, y, w, h, zoom) {
    zoom = zoom || 1;
    const scale = Math.max(w/img.width, h/img.height) * zoom;
    const sw = w/scale, sh = h/scale;
    const sx = (img.width - sw)/2, sy = (img.height - sh)/2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function wrapAndDraw(ctx, text, x, y, maxWidth, lineHeight, align) {
    const words = text.split(' ');
    let line = '';
    const lines = [];
    for (let w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line); line = w + ' ';
      } else line = test;
    }
    lines.push(line);
    lines.forEach((l,i) => {
      const lw = ctx.measureText(l.trim()).width;
      const lx = align === 'center' ? x - lw/2 : x;
      ctx.fillText(l.trim(), lx, y + i*lineHeight);
    });
    return lines.length;
  }

  // fit the WHOLE image inside the box (no cropping), centered
  function drawContain(ctx, img, x, y, w, h, zoom) {
    zoom = zoom || 1;
    const scale = Math.min(w/img.width, h/img.height) * zoom;
    const dw = img.width*scale, dh = img.height*scale;
    const dx = x + (w-dw)/2, dy = y + (h-dh)/2;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function wrapLines(ctx, text, maxW) {
    const paras = String(text).split('\n');
    const lines = [];
    for (const para of paras) {
      const words = para.split(/\s+/).filter(Boolean);
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
        else line = test;
      }
      lines.push(line);
    }
    return lines;
  }

  // auto-shrink the news text so it always fits its box
  function drawFittedText(ctx, text, x, top, maxW, bottom) {
    text = String(text || '').slice(0, 700);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const maxH = bottom - top;
    let fsz, lh, lines;
    for (fsz = 56; fsz >= 24; fsz -= 2) {
      ctx.font = `700 ${fsz}px "Noto Sans Devanagari", Arial`;
      lh = fsz * 1.36;
      lines = wrapLines(ctx, text, maxW);
      if (lines.length * lh <= maxH) break;
    }
    lines.forEach((l, i) => ctx.fillText(l, x, top + i * lh));
  }

  function socialIcon(ctx, kind, cx, cy, r) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    if (kind === 'yt') ctx.fillStyle = '#ff0000';
    else if (kind === 'tt') ctx.fillStyle = '#010101';
    else {
      const g = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
      g.addColorStop(0, '#feda75'); g.addColorStop(0.4, '#d62976'); g.addColorStop(1, '#4f5bd5');
      ctx.fillStyle = g;
    }
    ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
    if (kind === 'yt') {
      ctx.beginPath();
      ctx.moveTo(cx - r*0.28, cy - r*0.42);
      ctx.lineTo(cx - r*0.28, cy + r*0.42);
      ctx.lineTo(cx + r*0.48, cy);
      ctx.closePath(); ctx.fill();
    } else if (kind === 'tt') {
      // musical note
      ctx.lineWidth = r*0.16;
      ctx.beginPath();
      ctx.moveTo(cx - r*0.05, cy + r*0.30);
      ctx.lineTo(cx - r*0.05, cy - r*0.45);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - r*0.28, cy + r*0.32, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - r*0.05, cy - r*0.45);
      ctx.quadraticCurveTo(cx + r*0.45, cy - r*0.40, cx + r*0.40, cy - r*0.02);
      ctx.lineWidth = r*0.16; ctx.stroke();
    } else {
      ctx.lineWidth = r*0.13;
      const s = r*0.92;
      roundRect(ctx, cx - s/2, cy - s/2, s, s, s*0.28); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r*0.26, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + s*0.28, cy - s*0.28, r*0.07, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawSocialBar(ctx, W, H, hnd) {
    hnd = hnd || '@channel';
    const cy = H - 74;
    const r = 26, gapIcon = 16, gapGroup = 64;
    ctx.font = '700 32px "Noto Sans Devanagari", Arial';
    const kinds = ['yt','tt','ig'];
    const handleW = ctx.measureText(hnd).width;
    const groupW = r*2 + gapIcon + handleW;
    const total = groupW*3 + gapGroup*2;
    let x = W/2 - total/2;
    ctx.textBaseline = 'middle';
    for (const k of kinds) {
      socialIcon(ctx, k, x + r, cy, r);
      ctx.fillStyle = '#e9e9e9';
      ctx.textAlign = 'left';
      ctx.font = '700 32px "Noto Sans Devanagari", Arial';
      ctx.fillText(hnd, x + r*2 + gapIcon, cy + 1);
      x += groupW + gapGroup;
    }
  }

  async function drawStageFrame(idx, zoomProgress, imgIndex) {
    imgIndex = imgIndex || 0;
    const canvas = stageCanvasRef.current;
    const W = CANVAS_W, H = CANVAS_H;
    // NOTE: do NOT set canvas.width/height here — it resets the backing store every
    // frame and breaks canvas.captureStream() during recording (empty video + audio).
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    const ctx = canvas.getContext('2d');

    // background
    let bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a1120'); bg.addColorStop(1, '#03060d');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const item = news[idx] || { text: '', photos: [] };
    const photos = itemPhotos(item);

    // ===== top breaking-news bar =====
    const barH = 96;
    let g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, '#7f1010'); g.addColorStop(0.5, '#d61f1f'); g.addColorStop(1, '#7f1010');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, barH);
    ctx.fillStyle = '#fff';
    ctx.font = 'italic 900 48px Rajdhani, Arial';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('BREAKING NEWS', 48, barH/2 + 2);
    // logo circle right
    if (logoImgRef.current) {
      const ls = 74, lx = W - ls - 40, ly = barH/2 - ls/2;
      ctx.save();
      ctx.beginPath(); ctx.arc(lx+ls/2, ly+ls/2, ls/2, 0, Math.PI*2); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(lx, ly, ls, ls);
      drawCover(ctx, logoImgRef.current, lx, ly, ls, ls, 1);
      ctx.restore();
    }

    // ===== content card =====
    const cardX = 48, cardY = barH + 30;
    const cardW = W - cardX*2, cardH = H - cardY - 122;
    let cg = ctx.createLinearGradient(0, cardY, 0, cardY + cardH);
    cg.addColorStop(0, '#12203f'); cg.addColorStop(1, '#070d1c');
    roundRect(ctx, cardX, cardY, cardW, cardH, 24); ctx.fillStyle = cg; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = GOLD;
    roundRect(ctx, cardX, cardY, cardW, cardH, 24); ctx.stroke();

    const pad = 44;
    const gapMid = 44;
    const textW = Math.round(cardW * 0.50) - pad;
    const textX = cardX + pad;
    const photoX = textX + textW + gapMid;
    const photoW = cardX + cardW - pad - photoX;

    // "ताज़ा खबर" header pill
    const pillH = 66, pillY = cardY + 34, pillX = textX;
    ctx.font = '700 40px "Noto Sans Devanagari", Arial';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const pillTxt = 'ताज़ा खबर';
    const pillW = ctx.measureText(pillTxt).width + 48;
    roundRect(ctx, pillX, pillY, pillW, pillH, 10); ctx.fillStyle = '#d61f1f'; ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(pillTxt, pillX + 24, pillY + pillH/2 + 2);

    // news text (auto-fit)
    const txtTop = pillY + pillH + 30;
    const txtBottom = cardY + cardH - pad;
    drawFittedText(ctx, item.text || '', textX, txtTop, textW, txtBottom);

    // photo panel (right)
    const py = pillY, pH = cardY + cardH - pad - py;
    ctx.save();
    roundRect(ctx, photoX, py, photoW, pH, 16); ctx.clip();
    ctx.fillStyle = '#000'; ctx.fillRect(photoX, py, photoW, pH);
    if (photos.length) {
      const img = await getImg(photos[imgIndex % photos.length]);
      if (img) {
        // blurred cover as backdrop so the panel is filled (no plain black bars)
        ctx.save();
        ctx.filter = 'blur(16px) brightness(0.45)';
        drawCover(ctx, img, photoX-30, py-30, photoW+60, pH+60, 1.06);
        ctx.restore();
        // whole image, fitted inside the border (no cropping) + gentle ken-burns
        const zoom = 1 + 0.05 * (zoomProgress || 0);
        drawContain(ctx, img, photoX+8, py+8, photoW-16, pH-16, zoom);
      }
    } else {
      ctx.fillStyle = '#1a2740'; ctx.fillRect(photoX, py, photoW, pH);
      ctx.fillStyle = '#5a6b8a'; ctx.font = '600 30px "Noto Sans Devanagari", Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('फोटो', photoX + photoW/2, py + pH/2);
    }
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = GOLD;
    roundRect(ctx, photoX, py, photoW, pH, 16); ctx.stroke();

    // multi-image dots
    if (photos.length > 1) {
      const n = photos.length, dw = 26, dotY = py + pH - 30;
      let dx = photoX + photoW/2 - (n*dw)/2 + dw/2;
      for (let i = 0; i < n; i++) {
        ctx.beginPath(); ctx.arc(dx, dotY, 7, 0, Math.PI*2);
        ctx.fillStyle = (i === (imgIndex % n)) ? GOLD : 'rgba(255,255,255,0.45)';
        ctx.fill(); dx += dw;
      }
    }

    // ===== bottom social bar =====
    drawSocialBar(ctx, W, H, handle);
  }

  function drawEndFrame(ctx, W, H, t) {
    // background
    let bg = ctx.createRadialGradient(W/2, H*0.42, 100, W/2, H*0.42, W*0.7);
    bg.addColorStop(0, '#14213f'); bg.addColorStop(1, '#04070f');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // logo (center top)
    const ls = 190, lx = W/2 - ls/2, ly = H*0.10;
    if (logoImgRef.current) {
      ctx.save();
      ctx.beginPath(); ctx.arc(W/2, ly + ls/2, ls/2, 0, Math.PI*2); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(lx, ly, ls, ls);
      drawCover(ctx, logoImgRef.current, lx, ly, ls, ls, 1);
      ctx.restore();
      ctx.strokeStyle = GOLD; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(W/2, ly + ls/2, ls/2, 0, Math.PI*2); ctx.stroke();
    }

    // channel name
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 66px "Noto Sans Devanagari", Arial';
    ctx.fillText(channelName || 'News Channel', W/2, ly + ls + 60);
    ctx.fillStyle = GOLD; ctx.font = '700 38px "Noto Sans Devanagari", Arial';
    ctx.fillText(handle || '', W/2, ly + ls + 118);

    // three action icons popping in (staggered)
    const actions = [
      { k: 'like',    label: 'LIKE' },
      { k: 'share',   label: 'SHARE' },
      { k: 'comment', label: 'COMMENT' },
    ];
    const cy = H * 0.66;
    const spacing = 470;
    const startX = W/2 - spacing;
    actions.forEach((a, i) => {
      const appear = clamp01((t - (0.5 + i*0.55)) / 0.45);
      const s = easeOutCubic(appear);
      if (s <= 0) return;
      const cx = startX + i*spacing;
      const r = 92 * s;
      ctx.save();
      ctx.globalAlpha = s;
      // circle
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fillStyle = '#d61f1f'; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = GOLD; ctx.stroke();
      // glyph
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 8*s;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      if (a.k === 'like') {
        // thumbs up
        const u = r*0.5;
        ctx.beginPath();
        ctx.moveTo(cx - u*0.75, cy - u*0.05);
        ctx.lineTo(cx - u*0.35, cy - u*0.05);
        ctx.lineTo(cx - u*0.35, cy + u*0.9);
        ctx.lineTo(cx - u*0.75, cy + u*0.9);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx - u*0.2, cy + u*0.9);
        ctx.lineTo(cx - u*0.2, cy - u*0.15);
        ctx.quadraticCurveTo(cx - u*0.2, cy - u*0.85, cx + u*0.15, cy - u*0.8);
        ctx.quadraticCurveTo(cx + u*0.35, cy - u*0.78, cx + u*0.15, cy - u*0.15);
        ctx.lineTo(cx + u*0.85, cy - u*0.15);
        ctx.quadraticCurveTo(cx + u*1.02, cy - u*0.15, cx + u*0.9, cy + u*0.2);
        ctx.lineTo(cx + u*0.72, cy + u*0.78);
        ctx.quadraticCurveTo(cx + u*0.66, cy + u*0.9, cx + u*0.45, cy + u*0.9);
        ctx.closePath(); ctx.fill();
      } else if (a.k === 'share') {
        // share arrow
        ctx.lineWidth = 11*s;
        ctx.beginPath();
        ctx.arc(cx - r*0.28, cy, r*0.16, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + r*0.34, cy - r*0.38, r*0.16, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + r*0.34, cy + r*0.38, r*0.16, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx - r*0.16, cy - r*0.06); ctx.lineTo(cx + r*0.22, cy - r*0.32); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - r*0.16, cy + r*0.06); ctx.lineTo(cx + r*0.22, cy + r*0.32); ctx.stroke();
      } else {
        // comment bubble
        const bw = r*1.0, bh = r*0.72;
        roundRect(ctx, cx - bw/2, cy - bh/2 - r*0.08, bw, bh, r*0.22); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx - r*0.15, cy + bh*0.42);
        ctx.lineTo(cx - r*0.05, cy + bh*0.78);
        ctx.lineTo(cx + r*0.12, cy + bh*0.42);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#d61f1f';
        [-1,0,1].forEach(k => { ctx.beginPath(); ctx.arc(cx + k*r*0.26, cy - r*0.04, r*0.06, 0, Math.PI*2); ctx.fill(); });
      }
      // label
      ctx.globalAlpha = s;
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 34px Rajdhani, Arial';
      ctx.fillText(a.label, cx, cy + r + 34);
      ctx.restore();
    });

    // pulsing SUBSCRIBE button
    const subAppear = clamp01((t - 2.4) / 0.5);
    if (subAppear > 0) {
      const pulse = 1 + 0.05 * Math.sin(t * 6);
      const bw = 420 * pulse, bh = 96, bx = W/2 - bw/2, by = H*0.85;
      ctx.save();
      ctx.globalAlpha = subAppear;
      roundRect(ctx, bx, by, bw, bh, 16); ctx.fillStyle = '#d61f1f'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '900 46px Rajdhani, Arial';
      ctx.fillText('SUBSCRIBE', W/2, by + bh/2 + 2);
      ctx.restore();
    }
  }

  function playAll(onFinish, useCanvas) {
    setPlaying(true);
    playIntro(() => playNews(() => playOutro(() => {
      setPlaying(false);
      if (onFinish) onFinish();
    })));
  }

  function playOutro(onDone) {
    const canvas = stageCanvasRef.current;
    // keep canvas size stable (do not reset here — it breaks captureStream mid-recording)
    if (canvas.width !== CANVAS_W) canvas.width = CANVAS_W;
    if (canvas.height !== CANVAS_H) canvas.height = CANVAS_H;
    const ctx = canvas.getContext('2d');
    const start = performance.now();
    let speechDone = false;
    let rafId = null;
    function frame() {
      const t = (performance.now() - start) / 1000;
      drawEndFrame(ctx, CANVAS_W, CANVAS_H, t);
      if (t < OUTRO_MIN_DURATION || !speechDone) {
        rafId = requestAnimationFrame(frame);
      } else {
        cancelAnimationFrame(rafId);
        if (onDone) onDone();
      }
    }
    rafId = requestAnimationFrame(frame);
    speak(OUTRO_TEXT, () => { speechDone = true; });
  }

  function playIntro(onIntroDone) {
    const canvas = stageCanvasRef.current;
    // keep canvas size stable (do not reset here — it breaks captureStream mid-recording)
    if (canvas.width !== CANVAS_W) canvas.width = CANVAS_W;
    if (canvas.height !== CANVAS_H) canvas.height = CANVAS_H;
    const ctx = canvas.getContext('2d');
    const introStart = performance.now();
    let speechDone = false;
    let rafId = null;

    function frame() {
      const t = (performance.now() - introStart) / 1000;
      drawIntroFrame(ctx, CANVAS_W, CANVAS_H, t, logoImgRef.current);
      if (t < INTRO_MIN_DURATION || !speechDone) {
        rafId = requestAnimationFrame(frame);
      } else {
        cancelAnimationFrame(rafId);
        onIntroDone();
      }
    }
    rafId = requestAnimationFrame(frame);
    speak(INTRO_TEXT, () => { speechDone = true; });
  }

  function playNews(onFinish) {
    let idx = 0;
    setCurrent(0);
    let rafId = null;
    let itemStartTime = performance.now();

    const SECS_PER_IMG = 3.5;
    function animateFrame() {
      const elapsed = (performance.now() - itemStartTime) / 1000;
      const photos = itemPhotos(news[idx]);
      const imgIndex = photos.length > 1 ? Math.floor(elapsed / SECS_PER_IMG) : 0;
      const zoomProg = Math.min((elapsed % SECS_PER_IMG) / SECS_PER_IMG, 1);
      drawStageFrame(idx, zoomProg, imgIndex);
      rafId = requestAnimationFrame(animateFrame);
    }
    rafId = requestAnimationFrame(animateFrame);

    function playNext() {
      if (idx >= news.length) {
        if (rafId) cancelAnimationFrame(rafId);
        if (onFinish) onFinish();
        return;
      }
      setCurrent(idx);
      itemStartTime = performance.now();
      speak(news[idx].text, () => {
        idx++;
        setTimeout(playNext, 400);
      });
    }
    playNext();
  }

  async function recordAndDownload() {
    ensureAudio();
    const capturable = edgeOkRef.current || !!vrKey;
    if (!capturable) {
      setRecStatus("⚠ Aawaz record karne ke liye pehle VoiceRSS key daalo (ya local Hindi voice server chalao). Warna video silent banegi.");
    }
    try {
      const canvasStream = stageCanvasRef.current.captureStream(30);
      const audioTracks = audioDestRef.current ? audioDestRef.current.stream.getAudioTracks() : [];
      const combined = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

      let mime = 'video/webm;codecs=vp9,opus';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
      const recorder = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 6000000 });
      chunksRef.current = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        setVideoUrl(url);
        const link = document.createElement('a');
        link.download = 'news-video.webm';
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setRecStatus("✓ Video ban gayi aur apne-aap download ho gayi. (neeche preview bhi hai)");
      };
      recorderRef.current = recorder;
      recorder.start();
      setRecording(true);
      if (capturable) setRecStatus("Recording chal rahi hai — bina popup ke. Ban-te hi apne-aap download hogi.");
      playAll(() => {
        setTimeout(() => {
          if (recorderRef.current && recorderRef.current.state !== 'inactive') recorderRef.current.stop();
          setRecording(false);
        }, 600);
      }, true);
    } catch (err) {
      setRecStatus("Recording start nahi ho payi: " + err.message);
    }
  }

  function downloadVideo() {
    const link = document.createElement('a');
    link.download = 'news-video.webm';
    link.href = videoUrl;
    link.click();
  }

  function stopPlay() {
    window.speechSynthesis.cancel();
    if (ttsSrcRef.current) { try { ttsSrcRef.current.stop(); } catch(e) {} ttsSrcRef.current = null; }
    setPlaying(false);
    if (recorderRef.current && recorderRef.current.state !== 'inactive') recorderRef.current.stop();
    setRecording(false);
  }

  function generateThumbnail() {
    const canvas = thumbCanvasRef.current;
    const W = 1280, H = 720;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#111'; ctx.fillRect(0,0,W,H);

    const photos = news.flatMap(n=>itemPhotos(n)).filter(Boolean).slice(0,3);
    const loadImg = src => new Promise(res => { const im = new Image(); im.onload=()=>res(im); im.src=src; });

    Promise.all(photos.map(loadImg)).then(imgs => {
      if (imgs.length === 0) {
        ctx.fillStyle = '#333'; ctx.fillRect(0,0,W,H);
      } else if (imgs.length === 1) {
        drawCover(ctx, imgs[0], 0,0,W,H);
      } else if (imgs.length === 2) {
        drawCover(ctx, imgs[0], 0,0,W/2-4,H);
        drawCover(ctx, imgs[1], W/2+4,0,W/2-4,H);
      } else {
        drawCover(ctx, imgs[0], 0,0,W*0.6,H);
        drawCover(ctx, imgs[1], W*0.6+6,0,W*0.4-6,H/2-4);
        drawCover(ctx, imgs[2], W*0.6+6,H/2+4,W*0.4-6,H/2-4);
      }
      // dark gradient at bottom for text
      const grad = ctx.createLinearGradient(0,H*0.55,0,H);
      grad.addColorStop(0,'rgba(0,0,0,0)');
      grad.addColorStop(1,'rgba(0,0,0,0.88)');
      ctx.fillStyle = grad;
      ctx.fillRect(0,H*0.55,W,H*0.45);

      // top red breaking news bar
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(0,0,W,70);
      ctx.fillStyle = 'white';
      ctx.font = 'italic 900 34px Arial';
      ctx.fillText('BREAKING NEWS', 30, 48);

      // title text
      ctx.fillStyle = 'white';
      ctx.font = '900 58px Arial';
      wrapText(ctx, thumbTitle, 30, H-90, W-60, 62);

      setThumbUrl(canvas.toDataURL('image/png'));
    });
  }

  function drawCover(ctx, img, x, y, w, h, zoom) {
    zoom = zoom || 1;
    const scale = Math.max(w/img.width, h/img.height) * zoom;
    const sw = w/scale, sh = h/scale;
    const sx = (img.width - sw)/2, sy = (img.height - sh)/2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    const lines = [];
    for (let w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line); line = w + ' ';
      } else line = test;
    }
    lines.push(line);
    const startY = y - (lines.length-1)*lineHeight;
    lines.forEach((l,i) => ctx.fillText(l.trim(), x, startY + i*lineHeight));
  }

  function downloadThumb() {
    const link = document.createElement('a');
    link.download = 'youtube-thumbnail.png';
    link.href = thumbUrl;
    link.click();
  }

  return (
    <div>
      <h1>News Video Maker <span style={{fontSize:14, color:'#666', fontWeight:400}}>— YouTube Landscape (1920×1080)</span></h1>

      <div className="panel">
        <h2 style={{fontSize:15, color:'#b91c1c'}}>Step 1 — News Items (text + photo)</h2>
        {news.map((n, idx) => (
          <div className="news-item" key={idx}>
            <div className="photo-grid">
              {itemPhotos(n).map((p, pi) => (
                <div className="photo-thumb" key={pi}>
                  <img src={p} />
                  <button className="photo-del" onClick={()=>removePhoto(idx, pi)} title="Remove photo">×</button>
                </div>
              ))}
              <label className="photo-slot">
                <span>+ Photo</span>
                <input type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>updatePhotos(idx, e.target.files)} />
              </label>
            </div>
            <textarea value={n.text} onChange={e=>updateText(idx, e.target.value)} placeholder="Hindi news text..." />
            <button className="btn small secondary" onClick={()=>removeNews(idx)}>Remove</button>
          </div>
        ))}
        <button className="btn small" style={{marginTop:12}} onClick={addNews}>+ Add News</button>
      </div>

      <div className="panel">
        <h2 style={{fontSize:15, color:'#b91c1c'}}>Step 2 — Preview aur Voice Settings</h2>
        <div style={{background: (voiceboxOk||edgeOk||vrKey) ? '#ecfdf3' : '#fff7ed', border:'1px solid '+((voiceboxOk||edgeOk||vrKey)?'#12b76a':'#f59e0b'), borderRadius:8, padding:'10px 12px', marginBottom:14, fontSize:13}}>
          {voiceboxOk
            ? <span style={{color:'#067647', fontWeight:700}}>🎙️ Voicebox ON — jujar cloned voice use hogi (best quality, no popup).</span>
            : edgeOk
              ? <span style={{color:'#067647', fontWeight:700}}>🎙️ Local Hindi voice ON — recording ki aawaz aayegi (no popup).</span>
              : vrKey
                ? <span style={{color:'#067647', fontWeight:700}}>🎙️ VoiceRSS ON — recording ki aawaz aayegi (no popup).</span>
                : <span style={{color:'#b45309', fontWeight:700}}>⚠ Voicebox app kholo (jujar voice ke saath), ya neeche VoiceRSS key daalo. Warna video silent banegi.</span>}
        </div>
        <div className="controls" style={{marginBottom:14}}>
          <label>VoiceRSS Key: </label>
          <input value={vrKey} placeholder="free key paste karo"
            onChange={e=>{ setVrKey(e.target.value); ttsCacheRef.current={}; try{localStorage.setItem('nvm_voicerss_key', e.target.value);}catch(x){} }}
            style={{minWidth:230, padding:8, borderRadius:6, border:'1px solid #ccc'}} />
          <a href="https://www.voicerss.org/registration.aspx" target="_blank" rel="noreferrer" style={{fontSize:12}}>free key lo →</a>
          <label>Speed: </label>
          <input type="range" min="0.6" max="1.3" step="0.05" value={rate} onChange={e=>setRate(parseFloat(e.target.value))} />
          <span>{rate.toFixed(2)}x</span>
        </div>
        <div className="controls" style={{marginBottom:14}}>
          <label style={{fontSize:12, color:'#666'}}>Browser voice (sirf preview): </label>
          <select value={voiceIdx} onChange={e=>setVoiceIdx(parseInt(e.target.value))}>
            {voices.map((v,i) => <option key={i} value={i}>{v.name} ({v.lang})</option>)}
          </select>
        </div>
        <div className="controls" style={{marginBottom:14}}>
          <div className="field"><label>Channel Name</label>
            <input value={channelName} onChange={e=>setChannelName(e.target.value)} /></div>
          <div className="field"><label>Social Handle</label>
            <input value={handle} onChange={e=>setHandle(e.target.value)} /></div>
        </div>

        <div className="stage-wrap">
          <canvas ref={stageCanvasRef} width="1920" height="1080" style={{width:640, height:360, borderRadius:8, background:'#000'}}></canvas>
        </div>

        <div className="controls">
          {!playing
            ? <button className="btn" onClick={()=>playAll(null, true)}>▶ Preview Only (no recording)</button>
            : <button className="btn secondary" onClick={stopPlay}>⏹ Stop</button>}
          <span style={{fontSize:12, color:'#666'}}>News {current+1} / {news.length}</span>
        </div>

        <div className="controls" style={{marginTop:14}}>
          <button className="btn" onClick={recordAndDownload} disabled={recording}>
            {recording ? "⏺ Recording..." : "⏺ Record & Download Video"}
          </button>
        </div>
        {recStatus && <div style={{fontSize:12, color:'#b91c1c', marginTop:8, textAlign:'center'}}>{recStatus}</div>}
        {videoUrl && <div style={{textAlign:'center', marginTop:10}}>
          <video src={videoUrl} controls style={{maxWidth:300, borderRadius:8}}></video><br/>
          <button className="btn secondary" style={{marginTop:8}} onClick={downloadVideo}>Download Again (.webm)</button>
        </div>}
      </div>

      <div className="panel">
        <h2 style={{fontSize:15, color:'#b91c1c'}}>Step 3 — YouTube Thumbnail (automatic, direct download)</h2>
        <div className="controls" style={{marginBottom:10}}>
          <label>Thumbnail Title:</label>
          <input value={thumbTitle} onChange={e=>setThumbTitle(e.target.value)} style={{flex:1, minWidth:250, padding:8, borderRadius:6, border:'1px solid #ccc'}} />
        </div>
        <button className="btn" onClick={generateThumbnail}>Generate Thumbnail</button>
        {thumbUrl && <React.Fragment>
          <div><img src={thumbUrl} className="thumb-preview" /></div>
          <button className="btn secondary" style={{marginTop:10}} onClick={downloadThumb}>Download Thumbnail PNG</button>
        </React.Fragment>}
        <canvas ref={thumbCanvasRef} id="thumbCanvas"></canvas>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
</script>
</body>
</html>
